<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edukasi — Postpartum Care</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <script src="js/guard.js"></script>
</head>

<body>
  <div id="app-header"></div>

  <main class="main-content">
    <section id="tab-edukasi" class="tab-view active">
      <div class="page-header">
        <h1 class="page-title">Pusat Informasi &amp; Edukasi Pascapersalinan</h1>
        <p class="page-subtitle">Kumpulan artikel berbasis bukti medis dan literatur kesehatan perinatal yang disajikan
          dengan bahasa empatik dan mudah dipahami.</p>
      </div>

      <!-- Search & Filters -->
      <div class="filter-bar">
        <div class="search-input-wrapper">
          <span class="search-icon"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i></span>
          <input type="text" id="article-search-input" class="search-input"
            placeholder="Cari topik artikel (contoh: baby blues, luka jahitan, asi, overthinking)..."
            onkeyup="filterArticles()">
        </div>
        <div class="category-pills" id="article-category-pills">
          <button class="cat-pill active" data-cat="all" onclick="filterCategory(this, 'all')">Semua Kategori</button>
          <button class="cat-pill" data-cat="Mental" onclick="filterCategory(this, 'Mental')">Kesehatan Mental</button>
          <button class="cat-pill" data-cat="Fisik" onclick="filterCategory(this, 'Fisik')">Pemulihan Fisik</button>
          <button class="cat-pill" data-cat="Laktasi" onclick="filterCategory(this, 'Laktasi')">Menyusui &amp;
            Bayi</button>
          <button class="cat-pill" data-cat="Nutrisi" onclick="filterCategory(this, 'Nutrisi')">Perawatan Diri &amp;
            Nutrisi</button>
        </div>
      </div>

      <!-- Article Grid -->
      <div class="articles-grid-all" id="articles-container"></div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/common.js"></script>
  <script src="js/edukasi.js"></script>
</body>

</html>
