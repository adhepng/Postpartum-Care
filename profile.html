<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Saya — Postpartum Care</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <script src="js/guard.js"></script>
</head>

<body>
  <div id="app-header"></div>

  <main class="main-content">
    <section id="tab-profile" class="tab-view active">
      <div class="page-header">
        <h1 class="page-title">Profil Saya</h1>
        <p class="page-subtitle">Kelola nama, fase pemulihan, dan foto profil. Semua data tersimpan lokal di perangkat
          ini.</p>
      </div>

      <div class="panel-card profile-page-card">
        <form id="profile-form" onsubmit="saveProfileChanges(event)">
          <div class="profile-edit-head">
            <div class="profile-edit-avatar" id="profile-edit-avatar">R</div>
            <div class="profile-edit-photo">
              <div class="profile-edit-photo-actions">
                <button type="button" class="btn btn-sm btn-outline"
                  onclick="document.getElementById('profile-photo-input').click()">
                  <i class="fa-solid fa-camera" aria-hidden="true"></i> Ganti Foto
                </button>
                <button type="button" class="btn-text-highlight" id="profile-photo-remove"
                  onclick="removeProfilePhoto()">Hapus Foto</button>
              </div>
              <input type="file" id="profile-photo-input" accept="image/*" hidden
                onchange="handleProfilePhotoChange(event)">
              <p class="profile-edit-hint">JPG/PNG, maksimal 5 MB. Foto disimpan lokal di perangkat ini.</p>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="profile-name-input">Nama Lengkap</label>
            <input type="text" id="profile-name-input" class="form-input" maxlength="60" required
              oninput="updateProfileAvatarPreview()">
          </div>

          <div class="form-group">
            <label class="form-label" for="profile-email-input">Email (untuk login)</label>
            <input type="email" id="profile-email-input" class="form-input" disabled>
          </div>

          <div class="profile-edit-grid">
            <div class="form-group">
              <label class="form-label" for="profile-phase-input">Hari Pemulihan</label>
              <input type="number" id="profile-phase-input" class="form-input" min="0" max="365"
                placeholder="Contoh: 12">
            </div>
            <div class="form-group">
              <label class="form-label" for="profile-phone-input">No. Telepon</label>
              <input type="tel" id="profile-phone-input" class="form-input" maxlength="20"
                placeholder="08xxxxxxxxxx">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="profile-birth-input">Tanggal Lahir</label>
            <input type="date" id="profile-birth-input" class="form-input">
          </div>

          <div class="form-group">
            <label class="form-label" for="profile-bio-input">Bio Singkat</label>
            <textarea id="profile-bio-input" class="form-textarea" maxlength="160" rows="3"
              placeholder="Ceritakan sedikit tentang dirimu..." oninput="updateProfileBioCounter()"></textarea>
            <div class="profile-bio-counter" id="profile-bio-counter">0/160</div>
          </div>

          <div class="btn-row">
            <a class="btn btn-outline" href="index.html">Batal</a>
            <button type="submit" class="btn btn-primary">
              <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Simpan Perubahan
            </button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/common.js"></script>
  <script src="js/profile.js"></script>
</body>

</html>
